<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wangari — Farm Management</title>
<script>if(window.location.protocol==='https:')window.location.href='http://20.164.18.34/Frontend/admin/app.html';</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Frontend/assets/css/admin.css">
    <link rel="icon" type="image/png" href="/Frontend/images/wangari-logo.png">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Outfit',sans-serif;background:#f8fafc;color:#0f172a}
        .app{display:flex;min-height:100vh}
        .sidebar{width:260px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}
        .sidebar-brand{display:flex;align-items:center;gap:10px;padding:20px;border-bottom:1px solid #f1f5f9;font-weight:700;font-size:1.1rem;color:#0f172a}
        .sidebar-nav{flex:1;padding:8px;overflow-y:auto}
        .sidebar-nav .nav-section{font-size:0.7rem;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;padding:12px 12px 4px;margin-top:4px}
        .sidebar-nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#475569;text-decoration:none;font-size:0.88rem;font-weight:500;transition:all .15s}
        .sidebar-nav a:hover{background:#f1f5f9;color:#0f172a}
        .sidebar-nav a.active{background:#dcfce7;color:#166534;font-weight:600}
        .sidebar-footer{padding:12px;border-top:1px solid #f1f5f9;display:flex;flex-direction:column;gap:4px}
        .sidebar-footer a{padding:8px 12px;border-radius:6px;color:#64748b;text-decoration:none;font-size:0.85rem;transition:all .15s}
        .sidebar-footer a:hover{background:#f1f5f9;color:#0f172a}
        .main{flex:1;margin-left:260px;display:flex;flex-direction:column;min-height:100vh}
        .topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
        .topbar h1{font-size:1.25rem;font-weight:700}
        .content{padding:24px 28px;flex:1}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:20px}
        .stat-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px;transition:transform .15s,box-shadow .15s}
        .stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
        .stat-card.accent{border-left:4px solid #16a34a}
        .stat-card.warning{border-left:4px solid #f59e0b}
        .stat-card.info{border-left:4px solid #3b82f6}
        .stat-label{font-size:0.8rem;color:#64748b;font-weight:500;margin-bottom:4px}
        .stat-value{font-size:1.6rem;font-weight:700;color:#0f172a}
        .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;margin-bottom:20px}
        .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .card-header h3{font-size:1rem;font-weight:600}
        .table-responsive{overflow-x:auto}
        .table{width:100%;border-collapse:collapse;font-size:0.88rem}
        .table th{text-align:left;padding:10px 12px;border-bottom:2px solid #e2e8f0;color:#64748b;font-weight:600;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.03em}
        .table td{padding:10px 12px;border-bottom:1px solid #f1f5f9}
        .table tr:hover td{background:#f8fafc}
        .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:0.85rem;font-weight:600;border:none;cursor:pointer;transition:all .15s;text-decoration:none}
        .btn-primary{background:#16a34a;color:#fff}.btn-primary:hover{background:#15803d}
        .btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#dc2626}
        .btn-success{background:#16a34a;color:#fff}.btn-success:hover{background:#15803d}
        .btn-outline{background:transparent;border:1.5px solid #e2e8f0;color:#475569}.btn-outline:hover{background:#f8fafc}
        .btn-sm{padding:5px 10px;font-size:0.78rem;border-radius:6px}
        .form-group{margin-bottom:14px}
        .form-group label{display:block;font-size:0.8rem;font-weight:600;color:#475569;margin-bottom:4px}
        .form-input,.form-select{width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:0.88rem;font-family:'Outfit',sans-serif;background:#fff;color:#0f172a;transition:border-color .15s}
        .form-input:focus,.form-select:focus{outline:none;border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.1)}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.75rem;font-weight:600}
        .badge-active,.badge-completed,.badge-paid{background:#dcfce7;color:#166534}
        .badge-pending,.badge-scheduled{background:#fef3c7;color:#92400e}
        .badge-cancelled,.badge-expired,.badge-suspended,.badge-overdue{background:#fee2e2;color:#b91c1c}
        .badge-info{background:#dbeafe;color:#1e40af}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200}
        .modal{background:#fff;border-radius:16px;width:90%;max-width:600px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
        .modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid #f1f5f9}
        .modal-header h3{font-size:1.05rem;font-weight:700}
        .btn-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:#94a3b8;padding:4px 8px}
        .modal-body{padding:20px 24px}
        .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:0.88rem;font-weight:500;z-index:300;animation:slideIn .3s ease}
        .toast-success{background:#16a34a;color:#fff}
        .toast-error{background:#ef4444;color:#fff}
        @keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
        .empty{text-align:center;padding:40px;color:#94a3b8}
        .empty p{margin-top:8px;font-size:0.9rem}
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="/Frontend/images/wangari-logo.png" alt="W" style="height:28px">
            <span>Wangari</span>
        </div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">
            <a href="/">← Public Site</a>
            <a href="/wangariadmin/">🔑 Platform Admin</a>
            <a href="#" onclick="logout()" style="color:#ef4444">Logout</a>
        </div>
    </aside>
    <main class="main">
        <header class="topbar">
            <h1 id="pageTitle">Dashboard</h1>
            <div style="display:flex;align-items:center;gap:12px">
                <select id="speciesFilter" class="form-select" style="width:auto;display:none" onchange="load(currentMod)">
                    <option value="">All Species</option>
                    <option value="Chicken">🐔 Chicken</option>
                    <option value="Cattle">🐄 Cattle</option>
                    <option value="Goat">🐐 Goat</option>
                    <option value="Sheep">🐑 Sheep</option>
                    <option value="Pig">🐷 Pig</option>
                    <option value="Rabbit">🐇 Rabbit</option>
                    <option value="Duck">🦆 Duck</option>
                    <option value="Turkey">🦃 Turkey</option>
                    <option value="Fish">🐟 Fish</option>
                </select>
                <span id="adminName" style="color:#64748b;font-size:0.85rem"></span>
            </div>
        </header>
        <div id="content" class="content"></div>
    </main>
</div>
<div id="modalOverlay" class="modal-overlay" style="display:none" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header"><h3 id="modalTitle"></h3><button onclick="closeModal()" class="btn-close">&times;</button></div>
        <div id="modalBody" class="modal-body"></div>
    </div>
</div>
<script>
const API = '/api/v2.php';
let currentMod = 'dashboard';
let dropdowns = {};

// ── Navigation structure ──
const NAV = [
    {section:'Overview', items:[
        {id:'dashboard', icon:'📊', label:'Dashboard'}
    ]},
    {section:'Livestock', items:[
        {id:'animals', icon:'🐄', label:'Animals'},
        {id:'groups', icon:'👥', label:'Groups'},
        {id:'housing', icon:'🏠', label:'Housing'},
        {id:'health', icon:'💊', label:'Health'},
        {id:'vaccinations', icon:'💉', label:'Vaccinations'},
        {id:'production', icon:'🥚', label:'Production'},
        {id:'breeding', icon:'🧬', label:'Breeding'},
        {id:'feeding', icon:'🍽️', label:'Feeding'},
        {id:'milking', icon:'🥛', label:'Milking'},
        {id:'weights', icon:'⚖️', label:'Weight Tracking'},
        {id:'body_condition', icon:'📋', label:'Body Condition'},
        {id:'mortality', icon:'☠️', label:'Mortality'},
        {id:'quarantine', icon:'隔离', label:'Quarantine'},
        {id:'preventive_care', icon:'🛡️', label:'Preventive Care'},
        {id:'transport', icon:'🚛', label:'Transport'},
        {id:'growth', icon:'📈', label:'Growth Monitoring'},
    ]},
    {section:'Crops', items:[
        {id:'crops', icon:'🌾', label:'Fields & Plantings'},
        {id:'egg_grading', icon:'🥚', label:'Egg Grading'},
        {id:'hatchery', icon:'🐣', label:'Hatchery'},
        {id:'feed_production', icon:'🏭', label:'Feed Production'},
    ]},
    {section:'Business', items:[
        {id:'finance', icon:'💰', label:'Finance'},
        {id:'inventory', icon:'📦', label:'Inventory'},
        {id:'lpo', icon:'📄', label:'LPOs'},
        {id:'purchase_orders', icon:'🛒', label:'Purchase Orders'},
        {id:'crm', icon:'🤝', label:'CRM'},
    ]},
    {section:'Team', items:[
        {id:'staff', icon:'👷', label:'Staff & Wages'},
    ]},
    {section:'System', items:[
        {id:'reminders', icon:'⏰', label:'Reminders'},
        {id:'users', icon:'👤', label:'Users'},
        {id:'settings', icon:'⚙️', label:'Settings'},
    ]},
];

// ── Build sidebar ──
function buildNav() {
    const nav = document.getElementById('sidebarNav');
    nav.innerHTML = NAV.map(sec =>
        `<div class="nav-section">${sec.section}</div>` +
        sec.items.map(i => `<a href="#" data-mod="${i.id}" onclick="load('${i.id}')">${i.icon} ${i.label}</a>`).join('')
    ).join('');
}

// ── API helper ──
async function api(mod, action='list', params={}, body=null) {
    const u = new URL(API);
    u.searchParams.set('module', mod);
    u.searchParams.set('action', action);
    const sp = document.getElementById('speciesFilter').value;
    if (sp && mod !== 'dashboard') u.searchParams.set('species', sp);
    Object.entries(params).forEach(([k,v]) => { if (v !== undefined && v !== null && v !== '') u.searchParams.set(k, v); });
    const opts = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {};
    const r = await fetch(u, opts);
    return r.json();
}

// ── Navigation ──
function load(mod) {
    currentMod = mod;
    document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
    document.querySelector(`[data-mod="${mod}"]`)?.classList.add('active');
    const item = NAV.flatMap(s => s.items).find(i => i.id === mod);
    document.getElementById('pageTitle').textContent = item ? `${item.icon} ${item.label}` : mod;
    const needsSpecies = !['dashboard','users','settings','reminders'].includes(mod);
    document.getElementById('speciesFilter').style.display = needsSpecies ? 'block' : 'none';
    const fn = window['render_' + mod];
    if (fn) fn(); else document.getElementById('content').innerHTML = '<div class="empty"><p>Module coming soon...</p></div>';
}

function logout() { localStorage.removeItem('wangari_user'); location.href = '/Frontend/pages/login.html'; }
function openModal(title, html) { document.getElementById('modalTitle').textContent = title; document.getElementById('modalBody').innerHTML = html; document.getElementById('modalOverlay').style.display = 'flex'; }
function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
function toast(msg, type='success') { const t = document.createElement('div'); t.className = 'toast toast-'+type; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
function v(id) { const el = document.getElementById(id); return el ? el.value : ''; }

// ── Generic list renderer ──
function renderList(title, data, columns, mod, saveFn) {
    if (!data || !data.length) return `<div class="card"><div class="card-header"><h3>${title}</h3><button onclick="showForm_${mod}()" class="btn btn-primary">+ Add</button></div><div class="empty"><p>No records yet. Click "+ Add" to create one.</p></div></div>`;
    const thead = columns.map(c => `<th>${c.label}</th>`).join('');
    const rows = data.map(row => {
        const cells = columns.map(c => `<td>${row[c.key] ?? '-'}</td>`).join('');
        return `<tr>${cells}<td style="white-space:nowrap"><button onclick="edit_${mod}(${row.id})" class="btn btn-sm btn-outline">Edit</button> <button onclick="del('${mod}',${row.id})" class="btn btn-sm btn-danger">Del</button></td></tr>`;
    }).join('');
    return `<div class="card"><div class="card-header"><h3>${title} (${data.length})</h3><button onclick="showForm_${mod}()" class="btn btn-primary">+ Add</button></div><div class="table-responsive"><table class="table"><thead><tr>${thead}<th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

async function del(mod, id) { if (!confirm('Delete this record?')) return; await api(mod, 'delete', {}, {id}); toast('Deleted'); load(currentMod); }
async function loadDropdowns() { try { dropdowns = await api('helpers', 'dropdowns'); } catch(e){} }
function opt(arr, selected) { return (arr||[]).map(i => typeof i === 'object' ? `<option value="${i.id}" ${i.id==selected?'selected':''}>${i.name||i.house_name||i.full_name||i.crop_name||i.label||''}</option>` : `<option value="${i}" ${i==selected?'selected':''}>${i}</option>`).join(''); }

// ══════════════════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════════════════
async function render_dashboard() {
    const d = await api('dashboard');
    document.getElementById('content').innerHTML = `
        <div class="stats-grid">
            <div class="stat-card accent"><div class="stat-label">Total Animals</div><div class="stat-value">${d.total_animals}</div></div>
            <div class="stat-card"><div class="stat-label">Groups</div><div class="stat-value">${d.total_groups}</div></div>
            <div class="stat-card info"><div class="stat-label">Fields</div><div class="stat-value">${d.total_fields}</div></div>
            <div class="stat-card accent"><div class="stat-label">Active Plantings</div><div class="stat-value">${d.active_plantings}</div></div>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">Today's Eggs</div><div class="stat-value">${d.today_eggs}</div></div>
            <div class="stat-card"><div class="stat-label">Today's Milk (L)</div><div class="stat-value">${d.today_milk}</div></div>
            <div class="stat-card warning"><div class="stat-label">Mortality</div><div class="stat-value">${d.today_mortality}</div></div>
            <div class="stat-card info"><div class="stat-label">Upcoming Vaccinations</div><div class="stat-value">${d.upcoming_vaccinations}</div></div>
        </div>
        <div class="stats-grid">
            <div class="stat-card accent"><div class="stat-label">Revenue This Month</div><div class="stat-value">KES ${(d.total_revenue||0).toLocaleString()}</div></div>
            <div class="stat-card warning"><div class="stat-label">Expenses</div><div class="stat-value">KES ${(d.total_expenses||0).toLocaleString()}</div></div>
            <div class="stat-card"><div class="stat-label">Pending Births</div><div class="stat-value">${d.pending_births}</div></div>
            <div class="stat-card info"><div class="stat-label">Open Orders</div><div class="stat-value">${d.open_orders}</div></div>
        </div>
        ${(d.species_counts||[]).length ? '<h3 style="margin:16px 0 12px;font-weight:600">By Species</h3><div class="stats-grid">' +
            d.species_counts.map(s => `<div class="stat-card"><div class="stat-label">${s.species}</div><div class="stat-value">${s.cnt}</div></div>`).join('') + '</div>' : ''}
        ${(d.recent_health||[]).length ? '<div class="card"><div class="card-header"><h3>Recent Health Records</h3></div><table class="table"><thead><tr><th>Date</th><th>Subject</th><th>Type</th><th>Vet</th></tr></thead><tbody>' +
            d.recent_health.map(r => `<tr><td>${r.record_date||''}</td><td>${r.subject||''}</td><td>${r.record_type||''}</td><td>${r.vet_name||'-'}</td></tr>`).join('') + '</tbody></table></div>' : ''}`;
}

// ══════════════════════════════════════════════════════════
// ANIMALS
// ══════════════════════════════════════════════════════════
async function render_animals() {
    await loadDropdowns();
    const d = await api('animals');
    document.getElementById('content').innerHTML = renderList('Animal Registry', d, [
        {key:'tag',label:'Tag'},{key:'name',label:'Name'},{key:'type',label:'Species'},
        {key:'breed',label:'Breed'},{key:'gender',label:'Gender'},{key:'status',label:'Status'},
    ], 'animals');
}
function showForm_animals() {
    openModal('Add Animal', `
        <form onsubmit="save_animals(event)">
            <div class="form-row"><div class="form-group"><label>Tag *</label><input id="f_tag" class="form-input" required></div>
            <div class="form-group"><label>Name *</label><input id="f_name" class="form-input" required></div></div>
            <div class="form-row"><div class="form-group"><label>Species</label><select id="f_type" class="form-select">${opt(['Chicken','Cattle','Goat','Sheep','Pig','Rabbit','Duck','Turkey','Guinea fowl','Fish','Other'])}</select></div>
            <div class="form-group"><label>Breed</label><input id="f_breed" class="form-input"></div></div>
            <div class="form-row"><div class="form-group"><label>Gender</label><select id="f_gender" class="form-select"><option>female</option><option>male</option></select></div>
            <div class="form-group"><label>Birth Date</label><input id="f_birth" class="form-input" type="date"></div></div>
            <div class="form-row"><div class="form-group"><label>Group</label><select id="f_group" class="form-select"><option value="">None</option>${opt(dropdowns.groups||[])}</select></div>
            <div class="form-group"><label>Status</label><select id="f_status" class="form-select"><option>Active</option><option>Inactive</option><option>Sold</option><option>Deceased</option></select></div></div>
            <div class="form-group"><label>Notes</label><textarea id="f_notes" class="form-input" rows="2"></textarea></div>
            <button type="submit" class="btn btn-primary" style="width:100%">Save Animal</button>
        </form>`);
}
async function save_animals(e) {
    e.preventDefault();
    await api('animals', 'save', {}, {
        tag:v('f_tag'), name:v('f_name'), type:v('f_type'), breed:v('f_breed'),
        gender:v('f_gender'), birth_date:v('f_birth'), group_id:v('f_group'),
        status:v('f_status'), notes:v('f_notes')
    });
    closeModal(); toast('Animal saved'); load('animals');
}
async function edit_animals(id) {
    const d = await api('animals', 'list');
    const a = d.find(x => x.id === id);
    if (!a) return;
    openModal('Edit Animal', `
        <form onsubmit="save_animals(event)">
            <input type="hidden" id="f_tag_id" value="${id}">
            <div class="form-row"><div class="form-group"><label>Tag</label><input id="f_tag" class="form-input" value="${a.tag||''}"></div>
            <div class="form-group"><label>Name</label><input id="f_name" class="form-input" value="${a.name||''}"></div></div>
            <div class="form-row"><div class="form-group"><label>Species</label><select id="f_type" class="form-select">${opt(['Chicken','Cattle','Goat','Sheep','Pig','Rabbit','Duck','Turkey','Other'],a.type)}</select></div>
            <div class="form-group"><label>Breed</label><input id="f_breed" class="form-input" value="${a.breed||''}"></div></div>
            <div class="form-row"><div class="form-group"><label>Gender</label><select id="f_gender" class="form-select">${opt(['female','male'],a.gender)}</select></div>
            <div class="form-group"><label>Birth Date</label><input id="f_birth" class="form-input" type="date" value="${a.birth_date||''}"></div></div>
            <div class="form-row"><div class="form-group"><label>Group</label><select id="f_group" class="form-select"><option value="">None</option>${opt(dropdowns.groups||[], a.group_id)}</select></div>
            <div class="form-group"><label>Status</label><select id="f_status" class="form-select">${opt(['Active','Inactive','Sold','Deceased'],a.status)}</select></div></div>
            <div class="form-group"><label>Notes</label><textarea id="f_notes" class="form-input" rows="2">${a.notes||''}</textarea></div>
            <button type="submit" class="btn btn-primary" style="width:100%">Update Animal</button>
        </form>`);
}

// ══════════════════════════════════════════════════════════
// GROUPS
// ══════════════════════════════════════════════════════════

// Generate render & form functions for all generic modules
Object.entries(GENERIC_MODULES).forEach(([mod, cfg]) => {
    window['render_' + mod] = async function() {
        await loadDropdowns();
        const d = await api(mod);
        document.getElementById('content').innerHTML = renderList(cfg.title, d, cfg.cols, mod);
    };
    window['showForm_' + mod] = function() {
        const fieldsHtml = cfg.fields.map(f => {
            if (f.type === 'select') return `<div class="form-group"><label>${f.label}</label><select id="${f.id}" class="form-select">${opt(f.opts||[])}</select></div>`;
            if (f.type === 'textarea') return `<div class="form-group"><label>${f.label}</label><textarea id="${f.id}" class="form-input" rows="2"></textarea></div>`;
            return `<div class="form-group"><label>${f.label}</label><input id="${f.id}" class="form-input" type="${f.type}" ${f.type==='number'?'value="0"':''} ${f.type==='date'?'value="'+new Date().toISOString().split('T')[0]+'"':''}></div>`;
        }).join('');
        openModal('Add ' + cfg.title.replace(/s$/,''), `<form onsubmit="save_${mod}(event)">${fieldsHtml}<button type="submit" class="btn btn-primary" style="width:100%">Save</button></form>`);
    };
    window['save_' + mod] = async function(e) {
        e.preventDefault();
        const body = {};
        cfg.fields.forEach(f => body[f.id.replace('f_','')] = v(f.id));
        await api(mod, 'save', {}, body);
        closeModal(); toast(cfg.title.replace(/s$/,'') + ' saved'); load(mod);
    };
    window['edit_' + mod] = async function(id) {
        toast('Edit form coming soon — use Delete and re-add for now', 'info');
    };
});

async function render_crops() {
    await loadDropdowns();

    let html = `<div class="stats-grid"><div class="stat-card accent"><div class="stat-label">Fields</div><div class="stat-value">${fields.length}</div></div><div class="stat-card"><div class="stat-label">Active Plantings</div><div class="stat-value">${plantings.length}</div></div></div>`;
    html += `<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap"><button onclick="showForm_crop_field()" class="btn btn-primary">+ Add Field</button><button onclick="showForm_crop_planting()" class="btn btn-success">+ Add Planting</button></div>`;
    html += renderList('Fields', fields, [{key:'name',label:'Name'},{key:'size_acres',label:'Size (acres)'},{key:'soil_type',label:'Soil'},{key:'location',label:'Location'}], 'crop_field');
    html += renderList('Plantings', plantings, [{key:'crop_name',label:'Crop'},{key:'variety',label:'Variety'},{key:'field_name',label:'Field'},{key:'planting_date',label:'Planted'},{key:'status',label:'Status'}], 'crop_planting');
