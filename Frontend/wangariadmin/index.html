<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wangari Platform Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Frontend/assets/css/platform-admin.css">
    <link rel="icon" type="image/png" href="/Frontend/images/wangari-logo.png">
</head>
<body>
<!-- Login Screen -->
<div id="login-screen" class="login-screen">
    <div class="login-card">
        <img src="/Frontend/images/wangari-logo.png" alt="Wangari" style="height:52px;margin-bottom:20px;">
        <h1 style="font-size:1.6rem;">Platform Admin</h1>
        <p>Manage your platform, users & subscriptions</p>
        <div id="login-error" style="display:none;background:#FEE2E2;border:1px solid #FCA5A5;border-radius:12px;color:#991B1B;padding:14px;margin-bottom:20px;font-size:0.88rem;"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="login-user" class="form-input" required placeholder="admin">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-pass" class="form-input" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:12px;padding:14px;">
                Sign In
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </form>
    </div>
</div>

<!-- Admin Panel -->
<div id="admin-panel" class="admin-panel" style="display:none;">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="/Frontend/images/wangari-logo.png" alt="Wangari">
            <span>Wangari Admin</span>
        </div>
        <nav class="sidebar-nav">
            <a href="#" onclick="load('dashboard')" class="active" data-mod="dashboard">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Dashboard
            </a>
            <a href="#" onclick="load('users')" data-mod="users">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Users
            </a>
            <a href="#" onclick="load('codes')" data-mod="codes">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                Codes
            </a>
            <a href="#" onclick="load('subscriptions')" data-mod="subscriptions">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                Subscriptions
            </a>
            <a href="#" onclick="load('revenue')" data-mod="revenue">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Revenue
            </a>
            <a href="#" onclick="load('tickets')" data-mod="tickets">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                Tickets
            </a>
            <a href="#" onclick="load('emergency')" data-mod="emergency">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                Emergency
            </a>
            <a href="#" onclick="load('activity')" data-mod="activity">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                Activity Log
            </a>
            <a href="#" onclick="load('settings')" data-mod="settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Settings
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="/" class="sl">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Public Site
            </a>
            <a href="#" onclick="logout()" class="sl" style="color:#DC2626;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
            </a>
        </div>
    </aside>
    <main class="main">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button onclick="toggleSidebar()" style="display:none;background:none;border:1px solid var(--border);border-radius:10px;width:40px;height:40px;cursor:pointer;color:var(--heading);align-items:center;justify-content:center;" id="menuBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h1 id="pageTitle">Dashboard</h1>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
                <div style="display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--cream);border-radius:var(--radius-sm);border:1px solid var(--border-light);">
                    <div style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.85rem;" id="adminAvatar">A</div>
                    <span id="adminName" style="color:var(--heading);font-size:0.88rem;font-weight:700;"></span>
                </div>
            </div>
        </header>
        <div id="content" class="content"></div>
    </main>
</div>

<!-- Modals -->
<div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 id="modalTitle">Modal</h3>
            <button onclick="closeModal()" class="btn-close">&times;</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
const API = window.location.origin + '/api/platform.php';
let currentMod = 'dashboard';
let adminUser = null;

async function api(mod, action='get', params={}, body=null) {
    const u = new URL(API);
    u.searchParams.set('module', mod);
    u.searchParams.set('action', action);
    Object.entries(params).forEach(([k,v]) => { if(v!==undefined && v!==null && v!=='') u.searchParams.set(k,v); });
    const opts = body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {};
    const r = await fetch(u, opts);
    return r.json();
}

function load(mod) {
    currentMod = mod;
    document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
    document.querySelector(`[data-mod="${mod}"]`)?.classList.add('active');
    document.getElementById('pageTitle').textContent = mod.charAt(0).toUpperCase()+mod.slice(1);
    const fn = window['render_'+mod];
    if(fn) fn(); else document.getElementById('content').innerHTML = '<p>Coming soon...</p>';
    // Close sidebar on mobile
    document.getElementById('sidebar').classList.remove('open');
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}

function logout() { localStorage.removeItem('platform_admin'); location.reload(); }

function openModal(title, html) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('modal-overlay').style.display = 'flex';
}
function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

function toast(msg, type='success') {
    const t = document.createElement('div');
    t.className = 'toast toast-'+type;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

function v(id) { return document.getElementById(id)?.value || ''; }

// ════ LOGIN ════
document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const errDiv = document.getElementById('login-error');
    errDiv.style.display = 'none';
    try {
        const d = await api('auth','login',{},{username:document.getElementById('login-user').value,password:document.getElementById('login-pass').value});
        if(d.success) {
            adminUser = d.user;
            localStorage.setItem('platform_admin', JSON.stringify(d.user));
            init();
        } else {
            errDiv.textContent = d.error||'Login failed';
            errDiv.style.display = 'block';
        }
    } catch(err) {
        errDiv.textContent = 'Connection failed';
        errDiv.style.display = 'block';
    }
});

function init() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'flex';
    document.getElementById('adminName').textContent = adminUser.full_name||adminUser.username;
    document.getElementById('adminAvatar').textContent = (adminUser.full_name||adminUser.username||'A').charAt(0).toUpperCase();
    // Show mobile menu button
    if(window.innerWidth <= 860) {
        document.getElementById('menuBtn').style.display = 'flex';
    }
    load('dashboard');
}

// ════ DASHBOARD ════

    const d = await api('dashboard');

            <div style="position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle, rgba(34,197,94,0.15) 0%, transparent 70%);pointer-events:none;"></div>
            <div style="position:absolute;right:40px;bottom:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle, rgba(34,197,94,0.08) 0%, transparent 70%);pointer-events:none;"></div>
            <div style="position:relative;z-index:1;">
                <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.2);color:#4ADE80;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:16px;">
                    <span style="width:6px;height:6px;border-radius:50%;background:#4ADE80;"></span>
                    Platform Overview
                </div>
                <h1 style="margin:0 0 8px;font-size:1.8rem;font-weight:800;letter-spacing:-0.5px;">Welcome back, <span style="color:#4ADE80;font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;">Admin</span></h1>
                <p style="margin:0;color:rgba(255,255,255,0.65);font-size:0.92rem;max-width:500px;">Manage users, subscriptions, support tickets and platform health.</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card accent">
                <div><div class="stat-label">Total Users</div><div class="stat-value">${d.total_users}</div></div>
                <div class="stat-icon" style="background:var(--accent-soft);color:#15803D;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
            </div>
            <div class="stat-card green">
                <div><div class="stat-label">Active</div><div class="stat-value">${d.active_users}</div></div>
                <div class="stat-icon" style="background:var(--success-bg);color:#16A34A;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </div>
            </div>
            <div class="stat-card info">
                <div><div class="stat-label">Trial</div><div class="stat-value">${d.trial_users}</div></div>
                <div class="stat-icon" style="background:var(--warning-bg);color:#B45309;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
            </div>
            <div class="stat-card warning">
                <div><div class="stat-label">Expired</div><div class="stat-value">${d.expired_users}</div></div>
                <div class="stat-icon" style="background:var(--danger-bg);color:#DC2626;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card green">
                <div><div class="stat-label">Total Revenue</div><div class="stat-value">KES ${Number(d.total_revenue).toLocaleString()}</div></div>
                <div class="stat-icon" style="background:var(--accent-soft);color:#15803D;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
            </div>
            <div class="stat-card">
                <div><div class="stat-label">This Month</div><div class="stat-value">KES ${Number(d.month_revenue).toLocaleString()}</div></div>
                <div class="stat-icon" style="background:var(--border-light);color:var(--text-secondary);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>

            <div class="stat-card info">
                <div><div class="stat-label">Licenses</div><div class="stat-value">${d.unused_codes}</div></div>

                </div>
            </div>
            <div class="stat-card ${d.critical_tickets?'warning':''}">
                <div><div class="stat-label">Open Tickets</div><div class="stat-value">${d.open_tickets}${d.critical_tickets?' <span style="font-size:0.7em;color:var(--danger);">('+d.critical_tickets+' critical)</span>':''}</div></div>
                <div class="stat-icon" style="background:${d.critical_tickets?'var(--danger-bg)':'var(--warning-bg)'};color:${d.critical_tickets?'#DC2626':'#B45309'};">

        </div>

                    <button onclick="load('users')" class="btn btn-sm btn-outline">View All</button>

                <table class="table"><thead><tr><th>User</th><th>Status</th><th>Joined</th></tr></thead><tbody>

            <table class="table"><thead><tr><th>Month</th><th>Revenue</th><th>Transactions</th></tr></thead><tbody>

            </tbody></table></div>` : ''}`;
}

// ════ USERS ════

                    <option value="trial">Trial</option>
                    <option value="expired">Expired</option>
                    <option value="free">Free</option>
                    <option value="suspended">Suspended</option>

                <input type="text" id="userSearch" class="form-input" placeholder="Search..." onkeyup="filterUsers()" style="width:200px;">
            </div>

                <td style="white-space:nowrap;">
                    <button onclick="editUser(${u.id})" class="btn-sm btn-outline">Edit</button>
                    ${u.is_active?`<button onclick="deactivateUser(${u.id})" class="btn-sm btn-danger">Suspend</button>`:`<button onclick="activateUser(${u.id})" class="btn-sm btn-success">Activate</button>`}

async function render_codes() {
    const [allCodes, allUsers] = await Promise.all([api('codes','list'), api('users','list')]);
    const codes = Array.isArray(allCodes) ? allCodes : [];
    const users = Array.isArray(allUsers) ? allUsers : [];
    const userCodes = {};
    codes.forEach(c => { if (!userCodes[c.user_id]) userCodes[c.user_id] = []; userCodes[c.user_id].push(c); });
    const activeCount = codes.filter(c => c.status === 'active').length;
    const usedCount = codes.filter(c => c.hardware_id).length;
    const revokedCount = codes.filter(c => c.status === 'revoked').length;
    document.getElementById('content').innerHTML = `
        <div class="stats-grid">
            <div class="stat-card green"><div><div class="stat-label">Total Licenses</div><div class="stat-value">${codes.length}</div></div><div class="stat-icon" style="background:var(--accent-soft);color:#15803D;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></div></div>
            <div class="stat-card info"><div><div class="stat-label">Active</div><div class="stat-value">${activeCount}</div></div><div class="stat-icon" style="background:var(--success-bg);color:#16A34A;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div></div>
            <div class="stat-card warning"><div><div class="stat-label">Activated</div><div class="stat-value">${usedCount}</div></div><div class="stat-icon" style="background:var(--warning-bg);color:#B45309;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div></div>
            <div class="stat-card"><div><div class="stat-label">Revoked</div><div class="stat-value">${revokedCount}</div></div><div class="stat-icon" style="background:var(--danger-bg);color:#DC2626;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div></div>
        </div>
        <div class="card">
            <div class="card-header"><h3>All Users & License Status</h3><button onclick="showCreateCode()" class="btn btn-primary">+ Generate License</button></div>
            <div class="table-responsive"><table class="table">
                <thead><tr><th>User</th><th>Email</th><th>Sub Status</th><th>Licenses</th><th>License Keys</th><th>Actions</th></tr></thead>
                <tbody>${users.map(u => {
                    const uCodes = (userCodes[u.id] || []).filter(c => c.status === 'active');
                    const hasLicense = uCodes.length > 0;
                    const keys = uCodes.map(c => `<code style="background:var(--border-light);padding:2px 6px;border-radius:4px;font-size:0.72rem;margin:2px;display:inline-block;">${c.license_key}</code>`).join('');
                    return `<tr><td><strong>${u.full_name||u.username}</strong></td><td><small style="color:var(--text-secondary)">${u.email}</small></td><td><span class="badge badge-${u.subscription_status||'free'}">${u.subscription_status||'free'}</span></td><td><strong style="color:${hasLicense?'#15803D':'var(--danger)'}">${uCodes.length}</strong></td><td>${keys || '<span style="color:var(--muted)">No license</span>'}</td><td><button onclick="generateForUser(${u.id},'${(u.full_name||u.username).replace(/'/g,"\\'")}')" class="btn-sm btn-primary">Generate</button>${uCodes.length ? `<button onclick="revokeAllForUser(${u.id})" class="btn-sm btn-danger" style="margin-left:4px;">Revoke All</button>` : ''}</td></tr>`;
                }).join('')}</tbody>
            </table></div>
        </div>
        ${codes.length ? `<div class="card"><div class="card-header"><h3>All Licenses</h3></div><div class="table-responsive"><table class="table">
            <thead><tr><th>License Key</th><th>User</th><th>Plan</th><th>Devices</th><th>Expires</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>${codes.map(c=>`<tr><td><code style="background:var(--border-light);padding:4px 10px;border-radius:6px;font-weight:700;font-size:0.82rem;">${c.license_key}</code></td><td><strong>${c.account_full_name||c.account_username||'-'}</strong></td><td>${c.plan||'-'}</td><td>${c.activations||0}/${c.max_devices||1}</td><td><small>${c.expires_at||'Never'}</small></td><td><span class="badge badge-${c.status==='active'?'active':'expired'}">${c.status}</span></td><td><button onclick="revokeCode(${c.id})" class="btn-sm btn-danger">Revoke</button></td></tr>`).join('')}</tbody>
        </table></div></div>` : ''}`;
}

    const d = await api('activity','list');

            <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead>

    const raw = await api('settings','list');

    (Array.isArray(raw)?raw:[]).forEach(s => { settings[s.setting_key] = s.setting_value; });
    document.getElementById('content').innerHTML = `
        <div class="card">
            <div class="card-header"><h3>Platform Settings</h3></div>
            <form onsubmit="saveSettings(event)">
                <h4 style="margin:16px 0 12px;font-size:0.95rem;color:var(--heading);">Pricing</h4>
                <div class="form-row">
                    <div class="form-group"><label>Monthly Price (KES)</label><input id="s-monthly_price" class="form-input" type="number" value="${settings.monthly_price||2500}"></div>
                    <div class="form-group"><label>Quarterly Price (KES)</label><input id="s-quarterly_price" class="form-input" type="number" value="${settings.quarterly_price||6000}"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Annual Price (KES)</label><input id="s-annual_price" class="form-input" type="number" value="${settings.annual_price||20000}"></div>

                </div>
                <h4 style="margin:20px 0 12px;font-size:0.95rem;color:var(--heading);">Free Tier Limits</h4>
                <div class="form-row">
                    <div class="form-group"><label>Max Animals</label><input id="s-max_free_animals" class="form-input" type="number" value="${settings.max_free_animals||100}"></div>
                    <div class="form-group"><label>Max Fields</label><input id="s-max_free_fields" class="form-input" type="number" value="${settings.max_free_fields||10}"></div>
                </div>
                <h4 style="margin:20px 0 12px;font-size:0.95rem;color:var(--heading);">Payment (M-Pesa)</h4>
                <div class="form-row">
                    <div class="form-group"><label>Paybill Number</label><input id="s-mpesa_paybill" class="form-input" value="${settings.mpesa_paybill||''}"></div>
                    <div class="form-group"><label>Till Number</label><input id="s-mpesa_till" class="form-input" value="${settings.mpesa_till||''}"></div>
                </div>
                <h4 style="margin:20px 0 12px;font-size:0.95rem;color:var(--heading);">Support</h4>
                <div class="form-row">
                    <div class="form-group"><label>Support Email</label><input id="s-support_email" class="form-input" value="${settings.support_email||''}"></div>
                    <div class="form-group"><label>Support Phone</label><input id="s-support_phone" class="form-input" value="${settings.support_phone||''}"></div>
                </div>
                <h4 style="margin:20px 0 12px;font-size:0.95rem;color:var(--heading);">Platform</h4>
                <div class="form-row">
                    <div class="form-group"><label>Platform Name</label><input id="s-platform_name" class="form-input" value="${settings.platform_name||'Wangari'}"></div>
                    <div class="form-group"><label>Version</label><input id="s-platform_version" class="form-input" value="${settings.platform_version||'1.0.0'}" readonly></div>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top:16px;">Save All Settings</button>
            </form>
        </div>`;
}
async function saveSettings(e) {
    e.preventDefault();
    const keys = ['monthly_price','quarterly_price','annual_price','trial_duration_days','max_free_animals','max_free_fields','mpesa_paybill','mpesa_till','support_email','support_phone','platform_name'];
    let saved = 0;
    for (const key of keys) {
        const el = document.getElementById('s-'+key);
        if (el) { await api('settings','update',{},{key, value:el.value}); saved++; }
    }
    toast('Settings saved ('+saved+' updated)');
}

// ════ INIT ════
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('platform_admin');
    if(saved) {
        adminUser = JSON.parse(saved);
        init();
    }
    
    // Mobile menu button
    if(window.innerWidth <= 860) {
        document.getElementById('menuBtn').style.display = 'flex';
    }
    window.addEventListener('resize', () => {
        document.getElementById('menuBtn').style.display = window.innerWidth <= 860 ? 'flex' : 'none';
    });
    
    // Initialize Lucide icons
    if(typeof lucide !== 'undefined') lucide.createIcons();
});
</script>
