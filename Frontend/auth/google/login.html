<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signing in with Google... | Wangari</title>
    <link rel="icon" type="image/png" href="/Frontend/images/wangari-logo.png">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #000B22;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 20px;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #BEF264;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: rgba(255,255,255,0.6); font-size: 0.95rem; }
        a { color: #BEF264; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>Redirecting to Google Sign-In…</p>
    <p style="font-size:0.8rem; margin-top: 8px;">
        <a href="/">← Back to homepage</a>
    </p>

    <script>
    (function() {
        const CLIENT_ID = '130893240175-4uj4716lrfgl3idul3aadu025l8oin46.apps.googleusercontent.com';
        // Use the backend VPS callback when running on wangari.imeantech.com
        // Otherwise fall back to same-origin (local dev)
        let REDIRECT_URI = window.location.protocol + '//' + window.location.host + '/Frontend/auth/google/callback.php';

        // Generate a random CSRF state and store in sessionStorage
        const array = new Uint8Array(16);
        crypto.getRandomValues(array);
        const state = Array.from(array, b => b.toString(16).padStart(2, '0')).join('');
        sessionStorage.setItem('oauth_state', state);

        const params = new URLSearchParams({
            client_id:     CLIENT_ID,
            redirect_uri:  REDIRECT_URI,
            response_type: 'code',
            scope:         'https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',
            access_type:   'online',
            prompt:        'select_account',
            state:         state
        });

        window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
    })();
    </script>
</body>
</html>
