<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Completing sign-in… | Wangari</title>
    <link rel="icon" type="image/png" href="/Frontend/images/wangari-logo.png">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 16px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #16a34a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { color: #64748b; font-size: 0.9rem; }
        .error { color: #dc2626; background: #fee2e2; padding: 12px 20px; border-radius: 8px; display: none; }
        a { color: #16a34a; }
    </style>
</head>
<body>
    <div class="spinner" id="spinner"></div>
    <p class="status" id="status">Completing your sign-in…</p>
    <div class="error" id="error"></div>
    <p><a href="/Frontend/pages/login.html">← Back to login</a></p>

    <script>
    (function() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const errorParam = params.get('error');

        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error');
        const spinnerEl = document.getElementById('spinner');

        // If Google returned an error
        if (errorParam) {
            showError('Google sign-in was cancelled or failed: ' + params.get('error_description', errorParam));
            return;
        }

        // If no code, something is wrong
        if (!code) {
            showError('No authorization code received from Google.');
            return;
        }

        // Verify CSRF state
        const savedState = sessionStorage.getItem('oauth_state');
        sessionStorage.removeItem('oauth_state');

        if (!savedState || state !== savedState) {
            showError('Security verification failed. Please try logging in again.');
            return;
        }

        // Exchange the code for a session via the VPS API
        statusEl.textContent = 'Verifying with server…';

        fetch('/api/auth.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ google_code: code })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.success && data.user) {
                // Store user data (same as normal login)
                localStorage.setItem('wangari_user', JSON.stringify(data.user));
                if (data.session_id) {
                    localStorage.setItem('wangari_session', data.session_id);
                }

                statusEl.textContent = 'Welcome! Redirecting to your farm…';
                spinnerEl.style.display = 'none';

                // Redirect based on role
                setTimeout(function() {
                    window.location.href = data.redirect || '/Frontend/admin/dashboard.php';
                }, 500);
            } else {
                showError(data.error || 'Login failed. Please try again.');
            }
        })
        .catch(function(err) {
            showError('Could not connect to server. Please try again.');
        });

        function showError(msg) {
            statusEl.style.display = 'none';
            spinnerEl.style.display = 'none';
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
        }
    })();
    </script>
</body>
</html>
