<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>Wangari</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: linear-gradient(145deg, #0D3320 0%, #14532D 60%, #166534 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    user-select: none; overflow: hidden;
    -webkit-app-region: drag;
  }

  .logo-ring {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
    box-shadow: 0 0 40px rgba(134,239,172,0.2);
    animation: pulse 2s ease-in-out infinite;
  }

  .logo-ring svg { width: 44px; height: 44px; }

  h1 {
    color: #F0FDF4; font-size: 26px; font-weight: 700;
    letter-spacing: -0.5px; margin-bottom: 6px;
  }

  .tagline {
    color: rgba(240,253,244,0.55); font-size: 12px;
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 32px;
  }

  .bar-track {
    width: 200px; height: 3px;
    background: rgba(255,255,255,0.12);
    border-radius: 99px; overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #4ADE80, #86EFAC);
    border-radius: 99px;
    animation: load 2.5s ease-in-out forwards;
  }

  .status {
    margin-top: 16px;
    color: rgba(240,253,244,0.4); font-size: 11px;
    animation: blink 1.5s ease-in-out infinite;
  }

  @keyframes load {
    0%   { width: 0%; }
    40%  { width: 55%; }
    75%  { width: 82%; }
    100% { width: 100%; }
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 40px rgba(134,239,172,0.2); }
    50%       { box-shadow: 0 0 60px rgba(134,239,172,0.4); }
  }

  @keyframes blink {
    0%, 100% { opacity: 0.4; }
    50%       { opacity: 0.9; }
  }

  .version {
    position: absolute; bottom: 18px; right: 20px;
    color: rgba(240,253,244,0.25); font-size: 10px;
  }
</style>
</head>
<body>
  <div class="logo-ring">
    <svg viewBox="0 0 24 24" fill="none" stroke="#86EFAC" stroke-width="1.5" stroke-linecap="round">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
      <path d="M8 12s1-3 4-3 4 3 4 3"/>
      <path d="M9 17s1.5-2 3-2 3 2 3 2"/>
      <path d="M12 6v1"/>
    </svg>
  </div>

  <h1>Wangari</h1>
  <div class="tagline">Smart Farm Manager</div>

  <div class="bar-track">
    <div class="bar-fill"></div>
  </div>

  <div class="status">Starting secure environment…</div>
  <div class="version">v1.0.0</div>
</body>
</html>
