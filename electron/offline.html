<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wangari — Offline Mode</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F8FAF9;
    --surface: #FFFFFF;
    --border: #E2E8F0;
    --ink: #0F172A;
    --muted: #64748B;
    --accent: #16A34A;
    --accent-light: #DCFCE7;
    --danger: #EF4444;
    --warning: #F59E0B;
    --radius: 16px;
    --shadow: 0 1px 3px rgba(15,23,42,0.06), 0 4px 16px rgba(15,23,42,0.04);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', sans-serif;
    color: var(--ink);
    overflow: hidden;
  }

  /* ── TOP BAR ── */
  .topbar {
    height: 56px;
    background: linear-gradient(135deg, #052E16, #14532D, #166534);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    color: #fff;
    box-shadow: 0 2px 12px rgba(5,46,22,0.3);
  }
  .topbar-brand { display: flex; align-items: center; gap: 10px; }
  .topbar-brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .sync-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .sync-badge.offline { background: rgba(239,68,68,0.2); color: #FCA5A5; }
  .sync-badge.online { background: rgba(74,222,128,0.2); color: #86EFAC; }
  .sync-badge .dot { width: 7px; height: 7px; border-radius: 50%; }
  .sync-badge.offline .dot { background: #EF4444; animation: pulse 1.5s infinite; }
  .sync-badge.online .dot { background: #4ADE80; }

  /* ── LAYOUT ── */
  .layout { display: flex; height: calc(100% - 56px); }
  .sidebar {
    width: 220px; background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 16px 0;
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .sidebar-section { padding: 0 12px; margin-bottom: 20px; }
  .sidebar-label {
    font-size: 10px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
    padding: 0 12px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 10px;
    font-size: 13px; font-weight: 500;
    color: var(--muted); cursor: pointer;
    transition: all 0.15s ease;
    border: none; background: none; width: 100%;
    text-align: left; font-family: inherit;
  }
  .nav-item:hover { background: var(--accent-light); color: var(--accent); }
  .nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .pending-badge {
    margin-left: auto;
    background: var(--warning);
    color: #fff; font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 999px;
  }

  .main-content {
    flex: 1; overflow-y: auto; padding: 28px 32px;
  }

  /* ── DASHBOARD CARDS ── */
  .page-header { margin-bottom: 24px; }
  .page-header h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  .page-header p { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
    box-shadow: var(--shadow); position: relative; overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 24px rgba(15,23,42,0.08); }
  .stat-card .glow {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
  }
  .stat-card .icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px; font-size: 20px;
  }
  .stat-card .value { font-size: 28px; font-weight: 700; line-height: 1; }
  .stat-card .label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted); margin-top: 6px;
  }

  /* ── TABLE ── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden; margin-bottom: 20px;
  }
  .card-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-header h3 { font-size: 15px; font-weight: 700; }
  .search-input {
    padding: 8px 14px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 13px; width: 240px;
    outline: none; transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .table { width: 100%; border-collapse: collapse; }
  .table th {
    text-align: left; padding: 10px 16px; font-size: 11px;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); border-bottom: 1px solid var(--border);
    background: #FAFBFC;
  }
  .table td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid #F1F5F9; }
  .table tr:last-child td { border-bottom: none; }
  .table tr:hover td { background: #F8FAF9; }

  .badge {
    display: inline-flex; padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
  }
  .badge-green { background: #DCFCE7; color: #166534; }
  .badge-yellow { background: #FEF3C7; color: #92400E; }
  .badge-red { background: #FEE2E2; color: #991B1B; }
  .badge-blue { background: #DBEAFE; color: #1E40AF; }
  .badge-gray { background: #F1F5F9; color: #475569; }

  .btn {
    padding: 8px 16px; border-radius: 10px; font-size: 13px;
    font-weight: 600; border: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 0.15s ease; font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #15803D; transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--accent-light); }
  .btn-danger { background: #FEE2E2; color: #991B1B; }
  .btn-danger:hover { background: #FECACA; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.5);
    backdrop-filter: blur(4px); z-index: 1000;
    display: none; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: var(--radius);
    width: 480px; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 24px 64px rgba(0,0,0,0.2);
    padding: 28px;
  }
  .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--muted); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px 14px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 14px; font-family: inherit;
    outline: none; transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--accent);
  }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }
  .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  /* ── OFFLINE BANNER ── */
  .offline-banner {
    background: linear-gradient(135deg, #FEF3C7, #FDE68A);
    border: 1px solid #F59E0B;
    border-radius: 12px;
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px;
    font-size: 13px; color: #92400E;
  }
  .offline-banner svg { width: 20px; height: 20px; flex-shrink: 0; color: #D97706; }

  /* ── SYNC QUEUE ── */
  .sync-queue {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 20px;
    margin-bottom: 20px;
  }
  .sync-queue h4 { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .sync-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid #F1F5F9;
    font-size: 12px;
  }
  .sync-item:last-child { border-bottom: none; }

  /* ── ANIMATIONS ── */
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.3s ease forwards; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
</style>
</head>

<!-- ── TOP BAR ── -->
<div class="topbar">

// ─────────────────────────────────────────────────────────────────────────────
// OFFLINE DATABASE (in-memory for browser renderer)
// ─────────────────────────────────────────────────────────────────────────────

const DB_KEY = 'wangari_offline_db';

function getLocalDB() {
  try {
    return JSON.parse(localStorage.getItem(DB_KEY) || '{}');
  } catch { return {}; }
}

function saveLocalDB(db) {
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}

function initTable(name) {
  const db = getLocalDB();
  if (!db[name]) { db[name] = []; saveLocalDB(db); }
  return db[name];
}

function insertRecord(table, data) {
  const db = getLocalDB();
  if (!db[table]) db[table] = [];
  const id = Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  const record = {
    id,
    ...data,
    created_at: new Date().toISOString(),
    updated_at: new Date().toISOString(),
    _synced: false,
    _deleted: false,
  };
  db[table].push(record);
  saveLocalDB(db);
  addSyncQueueItem('insert', table, record);
  return record;
}

function updateRecord(table, id, data) {
  const db = getLocalDB();
  if (!db[table]) return null;
  const idx = db[table].findIndex(r => r.id === id);
  if (idx === -1) return null;
  db[table][idx] = { ...db[table][idx], ...data, updated_at: new Date().toISOString(), _synced: false };
  saveLocalDB(db);
  addSyncQueueItem('update', table, db[table][idx]);
  return db[table][idx];
}

function deleteRecord(table, id) {
  const db = getLocalDB();
  if (!db[table]) return;
  const idx = db[table].findIndex(r => r.id === id);
  if (idx === -1) return;
  db[table][idx]._deleted = true;
  db[table][idx]._synced = false;
  saveLocalDB(db);
  addSyncQueueItem('delete', table, { id });
}

function queryTable(table, filter = {}) {
  const db = getLocalDB();
  let records = db[table] || [];
  records = records.filter(r => !r._deleted);
  for (const [key, value] of Object.entries(filter)) {
    if (value !== undefined && value !== null && value !== '') {
      records = records.filter(r => r[key] === value);
    }
  }
  return records;
}

// ─────────────────────────────────────────────────────────────────────────────
// SYNC QUEUE
// ─────────────────────────────────────────────────────────────────────────────

const SYNC_KEY = 'wangari_sync_queue';

function getSyncQueue() {
  try { return JSON.parse(localStorage.getItem(SYNC_KEY) || '[]'); }
  catch { return []; }
}

function addSyncQueueItem(action, table, data) {
  const queue = getSyncQueue();
  queue.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2,6), action, table, data, timestamp: Date.now() });
  localStorage.setItem(SYNC_KEY, JSON.stringify(queue));
  updateSyncBadge();
}

function clearSyncQueue() {
  localStorage.setItem(SYNC_KEY, '[]');
  updateSyncBadge();
}

function updateSyncBadge() {
  const count = getSyncQueue().length;
  const el = document.getElementById('sync-count');
  el.textContent = count;
  el.style.display = count > 0 ? 'inline' : 'none';
}

// ─────────────────────────────────────────────────────────────────────────────
// PAGES
// ─────────────────────────────────────────────────────────────────────────────

let currentPage = 'dashboard';

function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  event?.target?.closest('.nav-item')?.classList.add('active');

  const content = document.getElementById('main-content');
  switch (page) {
    case 'dashboard': content.innerHTML = renderDashboard(); break;
    case 'users': content.innerHTML = renderUsers(); break;
    case 'products': content.innerHTML = renderProducts(); break;
    case 'orders': content.innerHTML = renderOrders(); break;
    case 'animals': content.innerHTML = renderAnimals(); break;
    case 'sync': content.innerHTML = renderSync(); break;
  }
  content.classList.add('fade-in');
}

function renderDashboard() {
  const users = queryTable('users');
  const products = queryTable('products');
  const orders = queryTable('orders');
  const animals = queryTable('animals');
  const queue = getSyncQueue();

  const totalRevenue = orders.reduce((s, o) => s + (o.total_amount || 0), 0);
  const pendingOrders = orders.filter(o => o.status === 'pending').length;
  const lowStock = products.filter(p => p.quantity <= p.min_stock).length;

  return `
    <div class="offline-banner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
      <div>

    <div class="stats-grid">

      <div class="stat-card">
        <div class="glow" style="background:linear-gradient(90deg,#3B82F6,#60A5FA)"></div>
        <div class="icon" style="background:#DBEAFE;color:#2563EB">📦</div>
        <div class="value">${products.length}</div>
        <div class="label">Products</div>
      </div>
      <div class="stat-card">
        <div class="glow" style="background:linear-gradient(90deg,#F59E0B,#FBBF24)"></div>
        <div class="icon" style="background:#FEF3C7;color:#D97706">📋</div>
        <div class="value">${orders.length}</div>

        <div class="value">${animals.length}</div>
        <div class="label">Animals</div>

      <div class="stat-card">

        <div class="icon" style="background:#D1FAE5;color:#059669">💰</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">

function renderUsers() {
  const users = queryTable('users');
  const queue = getSyncQueue();
  const pendingCount = queue.filter(q => q.table === 'users').length;

  return `
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <h2>Users</h2>
        <p>${users.length} registered users ${pendingCount > 0 ? `· ${pendingCount} pending sync` : ''}</p>
      </div>
      <button class="btn btn-primary" onclick="openModal('add-user')">+ Add User</button>
    </div>
    <div class="card">
      <div class="card-header">
        <h3>All Users</h3>
        <input class="search-input" placeholder="Search users..." oninput="filterTable('users', this.value)">
      </div>
      <table class="table" id="users-table">
        <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          ${users.map(u => `
            <tr>
              <td><strong>${u.full_name || u.username}</strong></td>
              <td style="color:var(--muted)">@${u.username}</td>
              <td><span class="badge badge-${u.role === 'super_admin' ? 'red' : u.role === 'farm_manager' ? 'blue' : u.role === 'stock_manager' ? 'yellow' : 'green'}">${(u.role || '').replace('_', ' ')}</span></td>
              <td style="color:var(--muted)">${u.email || '—'}</td>

        <h2>Animals</h2>

function renderSync() {
  const queue = getSyncQueue();

  return `
    <div class="page-header">
      <h2>Sync Queue</h2>
      <p>Changes made offline that will sync when you reconnect</p>
    </div>

    <div class="sync-queue">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h4>${queue.length} pending change${queue.length !== 1 ? 's' : ''}</h4>
        ${queue.length > 0 ? '<button class="btn btn-primary" onclick="attemptSync()">⟳ Sync Now</button>' : ''}
      </div>
      ${queue.length === 0
        ? '<div style="text-align:center;padding:32px;color:var(--muted)">✅ All changes synced — nothing pending</div>'
        : queue.map(q => `
          <div class="sync-item">
            <div>
              <span class="badge badge-${q.action === 'delete' ? 'red' : q.action === 'update' ? 'yellow' : 'green'}">${q.action}</span>
              <strong style="margin-left:8px">${q.table}</strong>
              <span style="color:var(--muted);margin-left:8px;font-size:11px">${q.data?.name || q.data?.username || q.data?.id || ''}</span>
            </div>
            <span style="color:var(--muted);font-size:11px">${new Date(q.timestamp).toLocaleTimeString()}</span>
          </div>
        `).join('')
      }
    </div>

    <div class="card">
      <div class="card-header"><h3>Sync Settings</h3></div>
      <div style="padding:20px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div style="padding:16px;background:#F8FAF9;border-radius:12px">
            <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px">PUSH FREQUENCY</div>
            <div style="font-size:16px;font-weight:700">Every 2 minutes</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">Local changes → Server</div>
          </div>
          <div style="padding:16px;background:#F8FAF9;border-radius:12px">
            <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px">PULL FREQUENCY</div>
            <div style="font-size:16px;font-weight:700">Every 5 minutes</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">Server changes → Local</div>
          </div>
          <div style="padding:16px;background:#F8FAF9;border-radius:12px">
            <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px">CONFLICT RESOLUTION</div>
            <div style="font-size:16px;font-weight:700">Last-write-wins</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">Server data takes priority</div>
          </div>
          <div style="padding:16px;background:#F8FAF9;border-radius:12px">
            <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px">OFFLINE GRACE PERIOD</div>
            <div style="font-size:16px;font-weight:700">14 days</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">App works without internet</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

// ─────────────────────────────────────────────────────────────────────────────
// MODALS & CRUD
// ─────────────────────────────────────────────────────────────────────────────

function openModal(type, data = {}) {
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal-content');

  const modals = {
    'add-user': `
      <h3>Add New User</h3>
      <div class="form-row">
        <div class="form-group"><label>Full Name</label><input id="m-fullname" value="${data.full_name || ''}"></div>
        <div class="form-group"><label>Username</label><input id="m-username" value="${data.username || ''}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Email</label><input id="m-email" type="email" value="${data.email || ''}"></div>
        <div class="form-group"><label>Phone</label><input id="m-phone" value="${data.phone || ''}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Role</label>
          <select id="m-role">
            <option value="customer" ${data.role === 'customer' ? 'selected' : ''}>Customer</option>
            <option value="sales_staff" ${data.role === 'sales_staff' ? 'selected' : ''}>Sales Staff</option>
            <option value="stock_manager" ${data.role === 'stock_manager' ? 'selected' : ''}>Stock Manager</option>
            <option value="farm_manager" ${data.role === 'farm_manager' ? 'selected' : ''}>Farm Manager</option>
            <option value="super_admin" ${data.role === 'super_admin' ? 'selected' : ''}>Super Admin</option>
          </select>
        </div>
        <div class="form-group"><label>Password</label><input id="m-password" type="password" value="${data.password || ''}"></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveUser(${data.id ? `'${data.id}'` : 'null'})">${data.id ? 'Update' : 'Create'} User</button>
      </div>
    `,
    'add-product': `
      <h3>${data.id ? 'Edit' : 'Add'} Product</h3>
      <div class="form-group"><label>Product Name</label><input id="m-name" value="${data.name || ''}"></div>
      <div class="form-row">
        <div class="form-group"><label>Category</label><input id="m-category" value="${data.category || ''}"></div>
        <div class="form-group"><label>Unit</label><input id="m-unit" value="${data.unit || 'piece'}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Price (KES)</label><input id="m-price" type="number" value="${data.price || 0}"></div>
        <div class="form-group"><label>Stock Quantity</label><input id="m-qty" type="number" value="${data.quantity || 0}"></div>
      </div>
      <div class="form-group"><label>Min Stock Alert</label><input id="m-minstock" type="number" value="${data.min_stock || 0}"></div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveProduct(${data.id ? `'${data.id}'` : 'null'})">${data.id ? 'Update' : 'Add'} Product</button>
      </div>
    `,
    'add-order': `
      <h3>New Order</h3>
      <div class="form-row">
        <div class="form-group"><label>Customer Name</label><input id="m-custname" value="${data.customer_name || ''}"></div>
        <div class="form-group"><label>Phone</label><input id="m-custphone" value="${data.customer_phone || ''}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Amount (KES)</label><input id="m-amount" type="number" value="${data.total_amount || 0}"></div>
        <div class="form-group"><label>Payment Method</label>
          <select id="m-payment">
            <option value="M-Pesa">M-Pesa</option>
            <option value="Cash">Cash</option>
            <option value="Bank">Bank Transfer</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveOrder()">Create Order</button>
      </div>
    `,
    'add-animal': `
      <h3>Add Animal</h3>
      <div class="form-row">
        <div class="form-group"><label>Tag Number</label><input id="m-tag" value="${data.tag_number || ''}"></div>
        <div class="form-group"><label>Name</label><input id="m-aname" value="${data.name || ''}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Species</label>
          <select id="m-species">
            <option value="chicken">Chicken</option>
            <option value="turkey">Turkey</option>
            <option value="goat">Goat</option>
            <option value="cow">Cow</option>
            <option value="pig">Pig</option>
          </select>
        </div>
        <div class="form-group"><label>Breed</label><input id="m-breed" value="${data.breed || ''}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Location</label><input id="m-location" value="${data.location || ''}"></div>
        <div class="form-group"><label>Weight (kg)</label><input id="m-weight" type="number" step="0.1" value="${data.weight || ''}"></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveAnimal()">Add Animal</button>
      </div>
    `,
  };

  modal.innerHTML = modals[type] || '<p>Unknown modal type</p>';
  overlay.classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function saveUser(id) {
  const data = {
    full_name: document.getElementById('m-fullname').value,
    username: document.getElementById('m-username').value,
    email: document.getElementById('m-email').value,
    phone: document.getElementById('m-phone').value,
    role: document.getElementById('m-role').value,
    is_active: 1,
  };
  if (id) updateRecord('users', id, data);
  else insertRecord('users', data);
  closeModal();
  showPage('users');
}

function editUser(id) {
  const user = queryTable('users').find(u => u.id === id);
  if (user) openModal('add-user', user);
}

function deleteUser(id) {
  if (confirm('Delete this user?')) {
    deleteRecord('users', id);
    showPage('users');
  }
}

function saveProduct(id) {
  const data = {
    name: document.getElementById('m-name').value,
    category: document.getElementById('m-category').value,
    unit: document.getElementById('m-unit').value,
    price: parseFloat(document.getElementById('m-price').value) || 0,
    quantity: parseInt(document.getElementById('m-qty').value) || 0,
    min_stock: parseInt(document.getElementById('m-minstock').value) || 0,
  };
  if (id) updateRecord('products', id, data);
  else insertRecord('products', data);
  closeModal();
  showPage('products');
}

function editProduct(id) {
  const p = queryTable('products').find(x => x.id === id);
  if (p) openModal('add-product', p);
}

function deleteProduct(id) {
  if (confirm('Delete this product?')) {
    deleteRecord('products', id);
    showPage('products');
  }
}

function saveOrder() {
  insertRecord('orders', {
    customer_name: document.getElementById('m-custname').value,
    customer_phone: document.getElementById('m-custphone').value,
    total_amount: parseFloat(document.getElementById('m-amount').value) || 0,
    payment_method: document.getElementById('m-payment').value,
    status: 'pending',
  });
  closeModal();
  showPage('orders');
}

function saveAnimal() {
  insertRecord('animals', {
    tag_number: document.getElementById('m-tag').value,
    name: document.getElementById('m-aname').value,
    species: document.getElementById('m-species').value,
    breed: document.getElementById('m-breed').value,
    location: document.getElementById('m-location').value,
    weight: parseFloat(document.getElementById('m-weight').value) || 0,
    status: 'active',
    gender: 'mixed',
  });
  closeModal();
  showPage('animals');
}

function filterTable(table, query) {
  // Simple client-side filter
  const tbody = document.querySelector(`#${table}-table tbody`);
  if (!tbody) return;
  const rows = tbody.querySelectorAll('tr');
  rows.forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(query.toLowerCase()) ? '' : 'none';
  });
}

function attemptSync() {
  alert('Sync will happen automatically when you reconnect to the internet.');
}

// ─────────────────────────────────────────────────────────────────────────────
// ONLINE/OFFLINE DETECTION
// ─────────────────────────────────────────────────────────────────────────────

function updateOnlineStatus() {
  const badge = document.getElementById('sync-status');
  const text = document.getElementById('sync-text');
  if (navigator.onLine) {
    badge.className = 'sync-badge online';
    text.textContent = 'Online';
  } else {
    badge.className = 'sync-badge offline';
    text.textContent = 'Offline Mode';
  }
}

window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();
updateSyncBadge();

// ─────────────────────────────────────────────────────────────────────────────
// IPC BRIDGE (for Electron)
// ─────────────────────────────────────────────────────────────────────────────

if (window.wangari) {
  // Listen for sync events from main process
  window.wangari.onSyncComplete((data) => {
    console.log('[offline-ui] Sync complete:', data);
    clearSyncQueue();
    showPage(currentPage);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────

showPage('dashboard');
</script>
